version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: weixin_p1_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: weixin_p1
      MYSQL_USER: weixin_user
      MYSQL_PASSWORD: weixin_pass123
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - '--character-set-server=utf8mb4'
      - '--collation-server=utf8mb4_unicode_ci'
      - '--default-authentication-plugin=mysql_native_password'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: weixin_p1_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  mysql_test:
    image: mysql:8.0
    container_name: weixin_p1_mysql_test
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: weixin_p1_test
      MYSQL_USER: weixin_test_user
      MYSQL_PASSWORD: weixin_test_pass
    ports:
      - '3307:3306'
    command:
      - '--character-set-server=utf8mb4'
      - '--collation-server=utf8mb4_unicode_ci'
      - '--default-authentication-plugin=mysql_native_password'

volumes:
  mysql_data:
  redis_data:
